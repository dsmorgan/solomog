version: '3'

dotenv: ['.env', 'versions.env']

vars:
  # Override with EDITION=community to use upstream OSS charts (no license key needed)
  EDITION: '{{.EDITION | default "enterprise"}}'

# vSphere homelab provisioner (optional capability — docs/specs/vsphere-provisioner.md).
# ALL vsphere:* tasks live in the included file; this block is the capability's ONLY
# footprint here. `optional: true` means the file's absence (or removal of the whole
# capability) leaves solomog exactly as before. Its tooling (OpenTofu) and VSPHERE_*
# config are lazy-checked by the scripts — nothing new is required for vind/EKS use.
includes:
  vsphere:
    taskfile: taskfiles/vsphere.yaml
    optional: true

# CLUSTER and CLUSTERS are interchangeable aliases everywhere:
#   - single-cluster tasks take the first name from whichever is set
#     (the solomog wrapper warns when a multi-name list is passed to these)
#   - multi-cluster tasks take the full space-separated list from whichever is set
# So `CLUSTERS=foo` on a single task and `CLUSTER="a b"` on a multi task both work.
# Mesh orchestration ≠ fan-out of expose/apps/apply — for that use a shell loop:
#   for c in a b; do solomog expose apps:utils ROUTE=true CLUSTER=$c; done

tasks:

  # ─── Meta ─────────────────────────────────────────────────────────────────

  default:
    internal: true
    desc: List all available scenarios
    cmds: [bash scripts/list.sh]
    silent: true

  setup:
    desc: Install Homebrew prereqs and the solomog symlink
    cmds: [bash scripts/setup.sh]

  setup:sudo:
    desc: "Passwordless /etc/hosts (one-time per machine)"
    summary: |
      Install a narrow /etc/sudoers.d fragment so solomog's ONE privileged operation —
      the whole-file /etc/hosts rewrite in scripts/lib/hosts.sh, which pins a gateway
      LoadBalancer IP to a .test hostname — runs with no password prompt. Point: a long
      unattended run (stack / expose / apply) no longer stalls mid-install waiting for you.

      The granted rule is
        <you> ALL=(root) NOPASSWD: /usr/bin/tee /etc/hosts
      and it is GENERATED from the same variable hosts.sh executes ($SOLOMOG_HOSTS_TEE,
      called by absolute path), so the command spec cannot drift from the command run.
      sudoers matches arguments too — the grant is that one path and nothing else, which
      is why hosts.sh dedups unprivileged and overwrites the whole file rather than
      using `tee -a` / `sed -i`.

      Trade-off, plainly: afterwards anything running as your user can rewrite /etc/hosts
      with no prompt (hostname redirection on this machine). No shell, no other file, no
      other command. Idempotent, and a no-op if some other sudoers rule already allows it.
      Not needed for DNS=real (vsphere/OPNsense) clusters — those touch no /etc/hosts.

      Cluster-free (machine setup, like `setup`).

      Variables:
        CHECK=true    verify only — no writes, no prompt (exit 1 if still password-gated)
        REMOVE=true   remove the fragment

      Examples:
        solomog setup:sudo
        solomog setup:sudo CHECK=true
        solomog setup:sudo REMOVE=true
    env:
      CHECK: '{{.CHECK | default ""}}'
      REMOVE: '{{.REMOVE | default ""}}'
    cmds: [bash scripts/setup-sudo.sh]

  versions:update:
    desc: "Check pins against GitHub latest (read-only)"
    cmds: [bash scripts/versions-update.sh]

  versions:show:
    desc: Show pinned product versions
    cmds: [cat versions.env]
    silent: true

  cluster:list:
    desc: "List tracked clusters (type, context, status)"
    aliases: ["clusters:list", "clusters", "cluster"]
    summary: |
      List clusters solomog knows about from local registries (.solomog/clusters for
      vind, .solomog/contexts for EKS/external). Soft-checks `vcluster list` (vind)
      and `aws eks describe-cluster` (EKS, only when AWS creds work — otherwise status
      stays "—"). No kubectl API calls. The current kubectl context is marked with *
      (bold green); ~ (green) means kubectl is on that same cluster but through a
      different context name — matched on the API server endpoint, since eksctl and
      `aws eks update-kubeconfig` each write their own context for one EKS cluster.
      Cluster-free (discovery only).

      Aliases: clusters:list, clusters, cluster

      Variables:
        (none)

      Examples:
        solomog cluster:list
        solomog cluster:show CLUSTER=a11
    cmds:
      - bash scripts/clusters.sh list
    silent: true

  cluster:show:
    desc: "Show one tracked cluster (CLUSTER=<name>)"
    aliases: ["clusters:show"]
    summary: |
      Detail view for one cluster: type, context, region (EKS), status (running/gone
      for vind; EKS via AWS when creds work, else "—"), certs dir, /etc/hosts entries,
      whether it is the current kubectl context (yes / no / "same cluster, via context
      <name>" when kubectl reaches it under a different context name). Cluster-free
      (discovery only — does not talk to the Kubernetes API server).

      Aliases: clusters:show

      Variables:
        CLUSTER    cluster name to inspect (REQUIRED)   see: solomog cluster:list
        CLUSTERS   alias for CLUSTER (first name used)

      Examples:
        solomog cluster:show CLUSTER=a11
        solomog cluster:show CLUSTER=e2a1
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/clusters.sh show {{.CLUSTER}}
    silent: true

  routes:
    desc: "Show agentgateway routes, backends, and policies"
    summary: |
      A brief, read-only view of the routing config on a cluster's agentgateway(s):
      each Gateway → its listeners → the HTTPRoutes attached to it (host/path →
      backend, which policies attach, and whether each route/gateway is actually
      ACTIVE per its .status conditions). Built from kubectl only — so unlike the
      proxy's config_dump / agctl, it also surfaces routes that AREN'T active
      (Accepted / ResolvedRefs / Programmed = False). Cluster-scoped, read-only;
      changes nothing. Scope is agentgateway today (auto-detected).

      Variables:
        CLUSTER   cluster to inspect (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        WIDE      true to also show per-rule matchers/filters and the failure
                  reason for any non-active route                          default false

      Examples:
        solomog routes CLUSTER=a8
        solomog routes CLUSTER=a8 WIDE=true
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      WIDE: '{{if eq (.WIDE | default "") "true"}}wide{{end}}'
    cmds:
      - bash scripts/routes.sh {{.CLUSTER}} {{.WIDE}}
    env:
      # CONTEXT override: inspect an existing external context (EKS) instead of vind.
      # Empty → vind default vcluster-docker_<cluster>. See scripts/lib/target.sh.
      CONTEXT: '{{.CONTEXT | default ""}}'
    silent: true

  # ─── Stack — compose any products on a single cluster ─────────────────────
  # The general-purpose entry point. Installs any combination of products onto
  # one cluster, in dependency order. Single-product tasks below are shortcuts.

  stack:
    desc: 'Compose any products onto a cluster'
    summary: |
      Create a cluster and install any combination of products onto it, in dependency
      order (istio → gloo-mesh → kgateway → gloo-gateway → agentgateway → kagent), regardless of
      the order you list them. Generates Istio certs first when a mesh product is requested.

      Variables:
        PRODUCTS     space-separated products to install (REQUIRED)   istio | gloo-mesh | kgateway | gloo-gateway | agentgateway | kagent
        CLUSTER      cluster name (vind, or registered external)  REQUIRED — set CLUSTER (or CONTEXT)
        EDITION      enterprise | community                           default enterprise
        ISTIO_MODE   ambient | sidecar (only affects istio)           default ambient
        TOKEN_EXCHANGE   true to enable the agentgateway STS (only if PRODUCTS includes
                         agentgateway); also restarts the agw proxy. CLI-only, default false.
        TOKEN_EXCHANGE_JWKS_URL / _API_VALIDATOR   see .env.example
        KGATEWAY_ELS_CRD true to also install the EnterpriseListenerSet CRD (only if PRODUCTS
                         includes kgateway; chart defaults it off). CLI-only, default false.
        KGATEWAY_SKIP_SHARED_CRDS  true when agentgateway already owns the shared ext-auth /
                         rate-limit / WAF CRDs on this cluster. CLI-only, default false.
                         NOTE: PRODUCTS="kgateway agentgateway" in ONE run installs kgateway
                         first, so it is agentgateway that then collides — that direction has
                         no opt-out wired yet. Install agentgateway first, then kgateway with
                         this flag.
        KAGENT_PROVIDER   openAI | anthropic | ollama (only if PRODUCTS includes kagent)
                                                                    default openAI
        KAGENT_MODEL      optional model override                   default chart value
        KAGENT_OLLAMA_HOST  Ollama endpoint                         default host.docker.internal:11434
        KAGENT_AUTOAUTH   true → force Enterprise bundled IdP for this run, ignoring a
                          persistent KAGENT_OIDC_ISSUER               default false (CLI-only)
        KAGENT_OIDC_*     Enterprise controller OIDC; blank (the default) uses the bundled
                          auto-IdP and needs no IdP setup. SOLO_UI_OIDC_* alone does NOT
                          put kagent behind that IdP — set KAGENT_OIDC_ISSUER to opt in.
                          See .env.example. Enterprise kagent is experimental; its documented
                          secured topology currently requires Istio 1.26-1.29.

      Examples:
        solomog stack PRODUCTS="agentgateway" CLUSTER=aaa
        solomog stack PRODUCTS="istio kgateway" CLUSTER=aaa ISTIO_MODE=sidecar
        solomog stack PRODUCTS="kgateway" EDITION=community CLUSTER=aaa
        solomog stack PRODUCTS="agentgateway" CLUSTER=aaa TOKEN_EXCHANGE=true
        solomog stack PRODUCTS="kagent" EDITION=community CLUSTER=aaa KAGENT_PROVIDER=ollama
        solomog stack PRODUCTS="agentgateway kagent" CLUSTER=aaa
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      PRODUCTS: '{{.PRODUCTS}}'
      ISTIO_MODE: '{{.ISTIO_MODE | default "ambient"}}'
    cmds:
      - bash scripts/stack.sh {{.CLUSTER}} {{.PRODUCTS}}
    env:
      EDITION: '{{.EDITION}}'
      # CONTEXT override: install onto an existing external context (EKS) instead of vind.
      # Empty → vind default vcluster-docker_<cluster>. See scripts/lib/target.sh.
      CONTEXT: '{{.CONTEXT | default ""}}'
      ISTIO_MODE: '{{.ISTIO_MODE}}'
      ISTIO_VERSION: '{{.ISTIO_VERSION | default (env "ISTIO_VERSION") | default ""}}'
      # TOKEN_EXCHANGE is CLI-only — no .env fallback — so it can never silently leak
      # into an unrelated cluster's install. See .env.example for why.
      TOKEN_EXCHANGE: '{{.TOKEN_EXCHANGE | default "false"}}'
      # CLI-only for the same reason (see the kgateway task).
      KGATEWAY_ELS_CRD: '{{.KGATEWAY_ELS_CRD | default "false"}}'
      KGATEWAY_SKIP_SHARED_CRDS: '{{.KGATEWAY_SKIP_SHARED_CRDS | default "false"}}'
      TOKEN_EXCHANGE_JWKS_URL: '{{.TOKEN_EXCHANGE_JWKS_URL | default (env "TOKEN_EXCHANGE_JWKS_URL") | default ""}}'
      TOKEN_EXCHANGE_API_VALIDATOR: '{{.TOKEN_EXCHANGE_API_VALIDATOR | default (env "TOKEN_EXCHANGE_API_VALIDATOR") | default ""}}'
      TOKEN_EXCHANGE_API_VALIDATOR_URL: '{{.TOKEN_EXCHANGE_API_VALIDATOR_URL | default (env "TOKEN_EXCHANGE_API_VALIDATOR_URL") | default ""}}'
      TOKEN_EXCHANGE_ELICITATION_SECRET: '{{.TOKEN_EXCHANGE_ELICITATION_SECRET | default (env "TOKEN_EXCHANGE_ELICITATION_SECRET") | default ""}}'
      # Cluster-specific: defaults to the cluster's Solo UI host so it tracks CLUSTER (like
      # OAUTH_ISSUER_HOST). Override in .env only for a non-default gateway/host. Inert unless
      # TOKEN_EXCHANGE=true. Blank .env value → this derived default applies.
      TOKEN_EXCHANGE_CALLBACK_URL: '{{.TOKEN_EXCHANGE_CALLBACK_URL | default (env "TOKEN_EXCHANGE_CALLBACK_URL") | default (printf "https://ui.agw.%s.test/age/elicitations" (.CLUSTER | default .CLUSTERS | default "" | splitList " " | first))}}'
      OAUTH_ISSUER: '{{.OAUTH_ISSUER | default "false"}}'
      OAUTH_ISSUER_HOST: '{{.OAUTH_ISSUER_HOST | default (printf "agw.%s.test" (.CLUSTER | default .CLUSTERS | default "" | splitList " " | first))}}'
      KAGENT_PROVIDER: '{{.KAGENT_PROVIDER | default (env "KAGENT_PROVIDER") | default "openAI"}}'
      KAGENT_MODEL: '{{.KAGENT_MODEL | default (env "KAGENT_MODEL") | default ""}}'
      KAGENT_OLLAMA_HOST: '{{.KAGENT_OLLAMA_HOST | default (env "KAGENT_OLLAMA_HOST") | default ""}}'
      KAGENT_AUTOAUTH: '{{.KAGENT_AUTOAUTH | default "false"}}'
      KAGENT_OIDC_ISSUER: '{{.KAGENT_OIDC_ISSUER | default (env "KAGENT_OIDC_ISSUER") | default ""}}'
      KAGENT_OIDC_CLIENT_ID: '{{.KAGENT_OIDC_CLIENT_ID | default (env "KAGENT_OIDC_CLIENT_ID") | default ""}}'
      KAGENT_OIDC_CLIENT_SECRET: '{{.KAGENT_OIDC_CLIENT_SECRET | default (env "KAGENT_OIDC_CLIENT_SECRET") | default ""}}'
      SOLO_UI_OIDC_ISSUER: '{{.SOLO_UI_OIDC_ISSUER | default (env "SOLO_UI_OIDC_ISSUER") | default ""}}'
      SOLO_UI_OIDC_ADDITIONAL_SCOPES: '{{.SOLO_UI_OIDC_ADDITIONAL_SCOPES | default (env "SOLO_UI_OIDC_ADDITIONAL_SCOPES") | default ""}}'
      SOLO_UI_OIDC_ROLE_MAPPER: '{{.SOLO_UI_OIDC_ROLE_MAPPER | default (env "SOLO_UI_OIDC_ROLE_MAPPER") | default ""}}'
      SOLO_UI_OIDC_BACKEND_CLIENT_ID: '{{.SOLO_UI_OIDC_BACKEND_CLIENT_ID | default (env "SOLO_UI_OIDC_BACKEND_CLIENT_ID") | default ""}}'
      SOLO_UI_OIDC_BACKEND_CLIENT_SECRET: '{{.SOLO_UI_OIDC_BACKEND_CLIENT_SECRET | default (env "SOLO_UI_OIDC_BACKEND_CLIENT_SECRET") | default ""}}'
      SOLO_UI_OIDC_FRONTEND_CLIENT_ID: '{{.SOLO_UI_OIDC_FRONTEND_CLIENT_ID | default (env "SOLO_UI_OIDC_FRONTEND_CLIENT_ID") | default ""}}'
      OPENAI_API_KEY: '{{.OPENAI_API_KEY | default (env "OPENAI_API_KEY") | default ""}}'
      CLAUDE_API_KEY: '{{.CLAUDE_API_KEY | default (env "CLAUDE_API_KEY") | default ""}}'
      KAGENT_LICENSE_KEY: '{{.KAGENT_LICENSE_KEY | default (env "KAGENT_LICENSE_KEY") | default ""}}'
      SOLO_LICENSE_KEY: '{{.SOLO_LICENSE_KEY | default (env "SOLO_LICENSE_KEY") | default ""}}'
    preconditions:
      - sh: '[ -n "{{.PRODUCTS}}" ]'
        msg: 'Specify products, e.g. PRODUCTS="istio kgateway agentgateway"'

  # ─── Istio — single cluster ───────────────────────────────────────────────

  istio:ambient:single:
    desc: "1 cluster · Istio ambient"
    summary: |
      Install Istio in ambient mode on one cluster. Shortcut for:
      stack PRODUCTS="istio" ISTIO_MODE=ambient (mode is fixed by this task —
      use istio:sidecar:single for sidecar).

      Variables:
        CLUSTER   cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        EDITION   enterprise | community                            default enterprise

      See `solomog help stack` for the full product-install reference.
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/stack.sh {{.CLUSTER}} istio
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: ambient

  istio:sidecar:single:
    desc: "1 cluster · Istio sidecar"
    summary: |
      Install Istio in sidecar mode on one cluster. Shortcut for:
      stack PRODUCTS="istio" ISTIO_MODE=sidecar (mode is fixed by this task —
      use istio:ambient:single for ambient).

      Variables:
        CLUSTER   cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        EDITION   enterprise | community                            default enterprise

      See `solomog help stack` for the full product-install reference.
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/stack.sh {{.CLUSTER}} istio
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: sidecar

  gloo-mesh:single:
    desc: "1 cluster · Istio + Gloo Mesh mgmt plane"
    summary: |
      Install Istio + the Gloo Mesh Enterprise management plane on one cluster.
      Shortcut for: stack PRODUCTS="istio gloo-mesh".

      Variables:
        CLUSTER      cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        EDITION      enterprise | community                            default enterprise
        ISTIO_MODE   ambient | sidecar                                 default ambient

      See `solomog help stack` for the full product-install reference.
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/stack.sh {{.CLUSTER}} istio gloo-mesh
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: '{{.ISTIO_MODE | default "ambient"}}'

  # ─── Istio — multi-cluster mesh ───────────────────────────────────────────
  # mesh.sh installs the istio product module onto each cluster with a shared CA.
  # flat    → clusters share one network; whole-subnet pod routing via networking.sh.
  # gateway → per-cluster network; mesh-eastwest.sh exposes + links east-west gateways and
  #           networking.sh routes to the peer gateway IPs — the mesh comes up peered.
  # Host routing is ephemeral (Docker VM) — re-run `solomog net:repair CLUSTERS="…"` after a
  # Docker Desktop restart (the mesh itself survives; only the routing is lost).
  # Override the cluster names with CLUSTERS="a b" (or CLUSTER="a b").
  # 3-cluster scenarios support mixed Istio versions via versions.env overrides.

  istio:ambient:multi-flat:
    desc: "2 clusters · ambient · flat network"
    summary: |
      Build a 2-cluster ambient Istio mesh on a flat (shared) network — one root CA,
      flat pod routing (networking.sh) so clusters reach each other directly. Host
      routing is ephemeral; re-run `solomog net:repair` after a Docker restart.

      Variables:
        CLUSTERS   space-separated cluster names   default "cluster-one cluster-two"
        EDITION    enterprise | community          default enterprise

      Mode (ambient) and topology (flat) are fixed by this task.
    vars:
      CLUSTERS: '{{.CLUSTERS | default .CLUSTER | default "cluster-one cluster-two"}}'
    cmds:
      - bash scripts/mesh.sh flat {{.CLUSTERS}}
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: ambient

  istio:sidecar:multi-flat:
    desc: "2 clusters · sidecar · flat network"
    summary: |
      Build a 2-cluster sidecar Istio mesh on a flat (shared) network — one root CA,
      flat pod routing (networking.sh) so clusters reach each other directly. Host
      routing is ephemeral; re-run `solomog net:repair` after a Docker restart.

      Variables:
        CLUSTERS   space-separated cluster names   default "cluster-one cluster-two"
        EDITION    enterprise | community          default enterprise

      Mode (sidecar) and topology (flat) are fixed by this task.
    vars:
      CLUSTERS: '{{.CLUSTERS | default .CLUSTER | default "cluster-one cluster-two"}}'
    cmds:
      - bash scripts/mesh.sh flat {{.CLUSTERS}}
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: sidecar

  istio:ambient:multi-gateway:
    desc: "2 clusters · ambient · east-west"
    summary: |
      Build a 2-cluster ambient Istio mesh on separate networks (east-west gateway
      topology): per-cluster networks, one shared root CA, east-west gateways exposed
      and linked, and host routing to the peer gateway IPs — comes up peered, no manual
      steps. Host routing is ephemeral; re-run `solomog net:repair` after a Docker restart.

      Variables:
        CLUSTERS   space-separated cluster names   default "cluster-one cluster-two"
        EDITION    enterprise | community          default enterprise

      Mode (ambient) and topology (gateway) are fixed by this task.
    vars:
      CLUSTERS: '{{.CLUSTERS | default .CLUSTER | default "cluster-one cluster-two"}}'
    cmds:
      - bash scripts/mesh.sh gateway {{.CLUSTERS}}
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: ambient

  istio:sidecar:multi-gateway:
    desc: "2 clusters · sidecar · east-west"
    summary: |
      Build a 2-cluster sidecar Istio mesh on separate networks (east-west gateway
      topology): per-cluster networks, one shared root CA, east-west gateways exposed
      and linked, and host routing to the peer gateway IPs — comes up peered, no manual
      steps. Host routing is ephemeral; re-run `solomog net:repair` after a Docker restart.

      Variables:
        CLUSTERS   space-separated cluster names   default "cluster-one cluster-two"
        EDITION    enterprise | community          default enterprise

      Mode (sidecar) and topology (gateway) are fixed by this task.
    vars:
      CLUSTERS: '{{.CLUSTERS | default .CLUSTER | default "cluster-one cluster-two"}}'
    cmds:
      - bash scripts/mesh.sh gateway {{.CLUSTERS}}
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: sidecar

  istio:ambient:multi-3:
    desc: "3 clusters · ambient · flat network"
    summary: |
      Build a 3-cluster ambient Istio mesh on a flat (shared) network — one root CA
      across all three, flat pod routing. Per-cluster Istio version overrides
      (ISTIO_VERSION_CLUSTER_TWO/THREE in versions.env) enable mixed-version meshes.
      Host routing is ephemeral; re-run `solomog net:repair` after a Docker restart.

      Variables:
        CLUSTERS   space-separated cluster names   default "cluster-one cluster-two cluster-three"
        EDITION    enterprise | community          default enterprise

      Mode (ambient) and topology (flat) are fixed by this task.
    vars:
      CLUSTERS: '{{.CLUSTERS | default .CLUSTER | default "cluster-one cluster-two cluster-three"}}'
    cmds:
      - bash scripts/mesh.sh flat {{.CLUSTERS}}
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: ambient

  istio:sidecar:multi-3:
    desc: "3 clusters · sidecar · flat network"
    summary: |
      Build a 3-cluster sidecar Istio mesh on a flat (shared) network — one root CA
      across all three, flat pod routing. Per-cluster Istio version overrides
      (ISTIO_VERSION_CLUSTER_TWO/THREE in versions.env) enable mixed-version meshes.
      Host routing is ephemeral; re-run `solomog net:repair` after a Docker restart.

      Variables:
        CLUSTERS   space-separated cluster names   default "cluster-one cluster-two cluster-three"
        EDITION    enterprise | community          default enterprise

      Mode (sidecar) and topology (flat) are fixed by this task.
    vars:
      CLUSTERS: '{{.CLUSTERS | default .CLUSTER | default "cluster-one cluster-two cluster-three"}}'
    cmds:
      - bash scripts/mesh.sh flat {{.CLUSTERS}}
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: sidecar

  istio:ambient:multi-3-gateway:
    desc: "3 clusters · ambient · east-west"
    summary: |
      Build a 3-cluster ambient Istio mesh on separate networks (east-west gateway topology):
      per-cluster networks, one shared root CA, east-west gateways exposed and linked in a FULL
      mesh (every cluster ↔ every other), and host routing to the peer gateway IPs — comes up
      peered, no manual steps. Host routing is ephemeral; re-run `solomog net:repair` after a
      Docker restart. Per-cluster Istio version overrides (versions.env) enable mixed versions.

      Variables:
        CLUSTERS   space-separated cluster names   default "cluster-one cluster-two cluster-three"
        EDITION    enterprise | community          default enterprise

      Mode (ambient) and topology (gateway) are fixed by this task.
    vars:
      CLUSTERS: '{{.CLUSTERS | default .CLUSTER | default "cluster-one cluster-two cluster-three"}}'
    cmds:
      - bash scripts/mesh.sh gateway {{.CLUSTERS}}
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: ambient

  istio:sidecar:multi-3-gateway:
    desc: "3 clusters · sidecar · east-west"
    summary: |
      Build a 3-cluster sidecar Istio mesh on separate networks (east-west gateway topology):
      per-cluster networks, one shared root CA, east-west gateways exposed and linked in a FULL
      mesh (every cluster ↔ every other), and host routing to the peer gateway IPs — comes up
      peered, no manual steps. Host routing is ephemeral; re-run `solomog net:repair` after a
      Docker restart. Per-cluster Istio version overrides (versions.env) enable mixed versions.

      Variables:
        CLUSTERS   space-separated cluster names   default "cluster-one cluster-two cluster-three"
        EDITION    enterprise | community          default enterprise

      Mode (sidecar) and topology (gateway) are fixed by this task.
    vars:
      CLUSTERS: '{{.CLUSTERS | default .CLUSTER | default "cluster-one cluster-two cluster-three"}}'
    cmds:
      - bash scripts/mesh.sh gateway {{.CLUSTERS}}
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: sidecar

  net:repair:
    desc: "Re-apply inter-cluster routing after a Docker restart"
    summary: |
      A Docker Desktop restart wipes the host-level routing between vcluster networks (it lives in
      the Docker VM), silently disconnecting a multi-cluster mesh — the clusters, Istio, gateways,
      and certs all survive. This re-applies just the routing, so recovery is cheap (no full task
      re-run). No stored state: bridges derive from the cluster names, and topology (flat vs
      gateway) is auto-detected from the live clusters.

      Variables:
        CLUSTERS   space-separated cluster names in the mesh (alias CLUSTER)   required

      Example:
        solomog net:repair CLUSTERS="ia1 ia2"
    vars:
      CLUSTERS: '{{.CLUSTERS | default .CLUSTER | default ""}}'
    cmds:
      - bash scripts/run.sh "Repair mesh routing → {{.CLUSTERS}}" bash scripts/net-repair.sh {{.CLUSTERS}}

  # ─── kgateway ────────────────────────────────────────────────────────────

  kgateway:
    desc: "1 cluster · kgateway"
    summary: |
      Install kgateway on one cluster. Shortcut for: stack PRODUCTS="kgateway".

      Variables:
        CLUSTER   cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        EDITION   enterprise | community                            default enterprise
        KGATEWAY_ELS_CRD   true to also install the EnterpriseListenerSet CRD (the chart
                           defaults it off). Enterprise only. CLI-only, default false.
                           Precondition for the agentgateway controller RBAC gap — see the
                           kgateway product module.
        KGATEWAY_SKIP_SHARED_CRDS  true when agentgateway is ALREADY installed on this
                           cluster: skips the ext-auth / rate-limit / WAF CRDs, which both
                           products' crds charts ship and Helm therefore refuses to
                           re-own. Enterprise only. CLI-only, default false.

      See `solomog help stack` for the full product-install reference.

      Examples:
        solomog kgateway CLUSTER=aaa
        solomog kgateway CLUSTER=aaa KGATEWAY_ELS_CRD=true
        solomog kgateway CLUSTER=aaa KGATEWAY_ELS_CRD=true KGATEWAY_SKIP_SHARED_CRDS=true
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/stack.sh {{.CLUSTER}} kgateway
    env:
      EDITION: '{{.EDITION}}'
      # CLI-only (hardcoded default, no .env fallback) so an ELS-CRD repro cluster can never
      # silently turn the CRD on for an unrelated cluster. Same rationale as TOKEN_EXCHANGE.
      KGATEWAY_ELS_CRD: '{{.KGATEWAY_ELS_CRD | default "false"}}'
      KGATEWAY_SKIP_SHARED_CRDS: '{{.KGATEWAY_SKIP_SHARED_CRDS | default "false"}}'

  kgateway:with-istio:
    desc: "1 cluster · kgateway + Istio sidecar"
    summary: |
      Install Istio (sidecar) + kgateway on one cluster. Shortcut for:
      stack PRODUCTS="istio kgateway" ISTIO_MODE=sidecar (mode fixed by this task).

      Variables:
        CLUSTER   cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        EDITION   enterprise | community                            default enterprise

      See `solomog help stack` for the full product-install reference.
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/stack.sh {{.CLUSTER}} istio kgateway
    env:
      EDITION: '{{.EDITION}}'
      ISTIO_MODE: sidecar

  # ─── Solo Portal (SEFK add-on; separate task) ──────────────────────────────
  # Developer portal controller. Own license (PORTAL_LICENSE_KEY). Requires
  # enterprise kgateway on the cluster today, but kept out of `kgateway` / stack
  # so it can later attach to other Solo products without reshaping the CLI.

  portal:
    desc: "Install Solo Portal on CLUSTER (enterprise, needs SEFK)"
    summary: |
      Install Solo Portal (portal-crds + portal controller) into portal-system, then
      apply a starter PortalParameters (in-memory store) + Portal so a portal web
      server comes up. Enterprise only. Requires Solo Enterprise for kgateway (SEFK)
      already on the cluster — install with `solomog kgateway` first. Kept as its own
      task (not folded into kgateway) so Portal can later attach to other products.

      License: PORTAL_LICENSE_KEY (falls back to SOLO_LICENSE_KEY). Version: PORTAL_VERSION
      in versions.env (tracks the SEFK chart line; pinned independently).

      Does NOT install the demo frontend or gateway routes — apply the
      `portal-httpbin` bundle for that (httpbin ApiProduct + Solo frontend on
      portal.<gw>.<cluster>.test / api.<gw>.<cluster>.test). See
      `solomog bundles:show BUNDLE=portal-httpbin`.

      Variables:
        CLUSTER   cluster name (context via solomog_context)   REQUIRED — set CLUSTER (or CONTEXT)
        CONTEXT   external kube context override               default "" (vind / registry)
        EDITION   enterprise (community is rejected — no community Portal)

      Examples:
        solomog kgateway portal CLUSTER=aaa
        solomog kgateway portal expose apply BUNDLE=portal-httpbin PRODUCT=kgateway CLUSTER=aaa
        solomog portal CLUSTER=aaa
        solomog portal CLUSTER=dmorgan-agw   # registered external (EKS)
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/run.sh "Install Solo Portal → {{.CLUSTER}}" bash scripts/install-portal.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      CONTEXT: '{{.CONTEXT | default ""}}'
      EDITION: '{{.EDITION}}'

  # ─── Gloo Gateway (distinct from kgateway) ────────────────────────────────

  gloo-gateway:
    desc: "1 cluster · Gloo Gateway"
    summary: |
      Install Gloo Gateway (gloo-ee 1.21.x) on one cluster. Shortcut for:
      stack PRODUCTS="gloo-gateway". A distinct product from kgateway.

      Variables:
        CLUSTER   cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        EDITION   enterprise | community                            default enterprise

      See `solomog help stack` for the full product-install reference.
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/stack.sh {{.CLUSTER}} gloo-gateway
    env:
      EDITION: '{{.EDITION}}'

  # ─── agentgateway ────────────────────────────────────────────────────────

  agentgateway:
    desc: "1 cluster · agentgateway"
    summary: |
      Install agentgateway on one cluster. Shortcut for: stack PRODUCTS="agentgateway".

      Variables:
        CLUSTER          cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        EDITION          enterprise | community                            default enterprise
        TOKEN_EXCHANGE   true to enable the OBO token-exchange STS (and restart the agw
                         proxy). CLI-only — no .env fallback. default false.
        TOKEN_EXCHANGE_JWKS_URL / _API_VALIDATOR   see .env.example
        OAUTH_ISSUER     true to enable the eager-auth OAuth issuer (gateway acts as the
                         OAuth AS at /oauth-issuer, brokers to Okta). Needs TOKEN_EXCHANGE=true
                         + OKTA_* in .env. CLI-only. default false.
        OAUTH_ISSUER_HOST   public gateway host for the issuer base_url.
                            default agw.<cluster>.test

      Related: `agentgateway:ui` adds the Solo UI. See `solomog help stack`.

      Examples:
        solomog agentgateway CLUSTER=aaa
        solomog agentgateway CLUSTER=aaa TOKEN_EXCHANGE=true
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/stack.sh {{.CLUSTER}} agentgateway
    env:
      EDITION: '{{.EDITION}}'
      # CONTEXT override: set to an existing kube context (e.g. EKS) to install onto it
      # instead of a vind cluster. Empty → vind default vcluster-docker_<cluster>. See lib/target.sh.
      CONTEXT: '{{.CONTEXT | default ""}}'
      TOKEN_EXCHANGE: '{{.TOKEN_EXCHANGE | default "false"}}'
      TOKEN_EXCHANGE_JWKS_URL: '{{.TOKEN_EXCHANGE_JWKS_URL | default (env "TOKEN_EXCHANGE_JWKS_URL") | default ""}}'
      TOKEN_EXCHANGE_API_VALIDATOR: '{{.TOKEN_EXCHANGE_API_VALIDATOR | default (env "TOKEN_EXCHANGE_API_VALIDATOR") | default ""}}'
      TOKEN_EXCHANGE_API_VALIDATOR_URL: '{{.TOKEN_EXCHANGE_API_VALIDATOR_URL | default (env "TOKEN_EXCHANGE_API_VALIDATOR_URL") | default ""}}'
      TOKEN_EXCHANGE_ELICITATION_SECRET: '{{.TOKEN_EXCHANGE_ELICITATION_SECRET | default (env "TOKEN_EXCHANGE_ELICITATION_SECRET") | default ""}}'
      # Cluster-specific: defaults to the cluster's Solo UI host so it tracks CLUSTER (like
      # OAUTH_ISSUER_HOST). Override in .env only for a non-default gateway/host. Inert unless
      # TOKEN_EXCHANGE=true. Blank .env value → this derived default applies.
      TOKEN_EXCHANGE_CALLBACK_URL: '{{.TOKEN_EXCHANGE_CALLBACK_URL | default (env "TOKEN_EXCHANGE_CALLBACK_URL") | default (printf "https://ui.agw.%s.test/age/elicitations" (.CLUSTER | default .CLUSTERS | default "" | splitList " " | first))}}'
      OAUTH_ISSUER: '{{.OAUTH_ISSUER | default "false"}}'
      OAUTH_ISSUER_HOST: '{{.OAUTH_ISSUER_HOST | default (printf "agw.%s.test" .CLUSTER)}}'

  # ─── kagent ──────────────────────────────────────────────────────────────

  kagent:
    desc: "1 cluster · kagent (Enterprise path is experimental)"
    summary: |
      Install kagent on one cluster. Community installs the stable OSS CRDs,
      controller, bundled PostgreSQL, and UI. Enterprise installs the Solo build
      plus the shared Solo management/UI release; this single-cluster evaluation
      path is experimental in solomog.

      Enterprise production security composes with ambient Istio and agentgateway,
      but kagent 0.5.x documents Istio 1.26-1.29 while solomog currently pins 1.30.
      The stack guard rejects that unsupported combination until you override the
      Istio pin to a supported version.

      Variables:
        CLUSTER          cluster name (context vcluster-docker_<CLUSTER>)   REQUIRED — set CLUSTER (or CONTEXT)
        EDITION          enterprise | community                            default enterprise
        KAGENT_PROVIDER  openAI | anthropic | ollama                        default openAI
        KAGENT_MODEL     optional provider model override                   default chart value
        KAGENT_OLLAMA_HOST  Ollama endpoint                                 default host.docker.internal:11434
        KAGENT_AUTOAUTH  true → force bundled IdP for this run                default false (CLI-only)
        KAGENT_OIDC_ISSUER / _CLIENT_ID / _CLIENT_SECRET
                         Enterprise controller OIDC; blank (default) uses the bundled
                         auto-IdP. SOLO_UI_OIDC_* alone does not imply these — set
                         KAGENT_OIDC_ISSUER to put kagent behind a real IdP.
        OPENAI_API_KEY   required when provider=openAI                      default from .env
        CLAUDE_API_KEY   required when provider=anthropic                   default from .env

      Examples:
        solomog kagent CLUSTER=aaa
        solomog kagent EDITION=community CLUSTER=aaa
        solomog kagent EDITION=community CLUSTER=aaa KAGENT_PROVIDER=ollama
        solomog stack PRODUCTS="agentgateway kagent" CLUSTER=aaa
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/stack.sh {{.CLUSTER}} kagent
    env:
      EDITION: '{{.EDITION}}'
      CONTEXT: '{{.CONTEXT | default ""}}'
      KAGENT_PROVIDER: '{{.KAGENT_PROVIDER | default (env "KAGENT_PROVIDER") | default "openAI"}}'
      KAGENT_MODEL: '{{.KAGENT_MODEL | default (env "KAGENT_MODEL") | default ""}}'
      KAGENT_OLLAMA_HOST: '{{.KAGENT_OLLAMA_HOST | default (env "KAGENT_OLLAMA_HOST") | default ""}}'
      KAGENT_AUTOAUTH: '{{.KAGENT_AUTOAUTH | default "false"}}'
      KAGENT_OIDC_ISSUER: '{{.KAGENT_OIDC_ISSUER | default (env "KAGENT_OIDC_ISSUER") | default ""}}'
      KAGENT_OIDC_CLIENT_ID: '{{.KAGENT_OIDC_CLIENT_ID | default (env "KAGENT_OIDC_CLIENT_ID") | default ""}}'
      KAGENT_OIDC_CLIENT_SECRET: '{{.KAGENT_OIDC_CLIENT_SECRET | default (env "KAGENT_OIDC_CLIENT_SECRET") | default ""}}'
      SOLO_UI_OIDC_ISSUER: '{{.SOLO_UI_OIDC_ISSUER | default (env "SOLO_UI_OIDC_ISSUER") | default ""}}'
      SOLO_UI_OIDC_ADDITIONAL_SCOPES: '{{.SOLO_UI_OIDC_ADDITIONAL_SCOPES | default (env "SOLO_UI_OIDC_ADDITIONAL_SCOPES") | default ""}}'
      SOLO_UI_OIDC_ROLE_MAPPER: '{{.SOLO_UI_OIDC_ROLE_MAPPER | default (env "SOLO_UI_OIDC_ROLE_MAPPER") | default ""}}'
      SOLO_UI_OIDC_BACKEND_CLIENT_ID: '{{.SOLO_UI_OIDC_BACKEND_CLIENT_ID | default (env "SOLO_UI_OIDC_BACKEND_CLIENT_ID") | default ""}}'
      SOLO_UI_OIDC_BACKEND_CLIENT_SECRET: '{{.SOLO_UI_OIDC_BACKEND_CLIENT_SECRET | default (env "SOLO_UI_OIDC_BACKEND_CLIENT_SECRET") | default ""}}'
      SOLO_UI_OIDC_FRONTEND_CLIENT_ID: '{{.SOLO_UI_OIDC_FRONTEND_CLIENT_ID | default (env "SOLO_UI_OIDC_FRONTEND_CLIENT_ID") | default ""}}'
      OPENAI_API_KEY: '{{.OPENAI_API_KEY | default (env "OPENAI_API_KEY") | default ""}}'
      CLAUDE_API_KEY: '{{.CLAUDE_API_KEY | default (env "CLAUDE_API_KEY") | default ""}}'
      KAGENT_LICENSE_KEY: '{{.KAGENT_LICENSE_KEY | default (env "KAGENT_LICENSE_KEY") | default ""}}'
      SOLO_LICENSE_KEY: '{{.SOLO_LICENSE_KEY | default (env "SOLO_LICENSE_KEY") | default ""}}'

  agentgateway:ui:
    desc: "1 cluster · agentgateway + Solo UI"
    summary: |
      Install agentgateway, then the Solo UI (management chart) on top. Enterprise only
      (community is rejected). With ROUTE=true, also routes the UI at ui.<gw>.<cluster>.test.

      Variables:
        CLUSTER      cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        ROUTE        true | false — route the UI on a sub-host          default false
        GATEWAY      gateway to target for tracing + routing            default agw
        GATEWAY_NS   gateway namespace                                  default agentgateway-system
        EDITION      enterprise (community is rejected — no community UI)
        TOKEN_EXCHANGE   true to enable the OBO token-exchange STS (and restart the agw
                         proxy). CLI-only — no .env fallback. default false.
        TOKEN_EXCHANGE_JWKS_URL / _API_VALIDATOR   see .env.example
        OAUTH_ISSUER     true to enable the eager-auth OAuth issuer (gateway acts as the
                         OAuth AS at /oauth-issuer, brokers to Okta). Needs TOKEN_EXCHANGE=true
                         + OKTA_* in .env. CLI-only. default false.
        OAUTH_ISSUER_HOST   public gateway host for the issuer base_url.
                            default agw.<cluster>.test

      Examples:
        solomog agentgateway:ui CLUSTER=aaa
        solomog agentgateway:ui expose ROUTE=true CLUSTER=aaa
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/stack.sh {{.CLUSTER}} agentgateway
      - bash scripts/run.sh "Install agentgateway UI → {{.CLUSTER}}" bash scripts/install-agentgateway-ui.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      CONTEXT: '{{.CONTEXT | default ""}}'
      EDITION: '{{.EDITION}}'
      ROUTE: '{{.ROUTE | default "false"}}'
      GATEWAY: '{{.GATEWAY | default "agw"}}'
      TOKEN_EXCHANGE: '{{.TOKEN_EXCHANGE | default "false"}}'
      TOKEN_EXCHANGE_JWKS_URL: '{{.TOKEN_EXCHANGE_JWKS_URL | default (env "TOKEN_EXCHANGE_JWKS_URL") | default ""}}'
      TOKEN_EXCHANGE_API_VALIDATOR: '{{.TOKEN_EXCHANGE_API_VALIDATOR | default (env "TOKEN_EXCHANGE_API_VALIDATOR") | default ""}}'
      TOKEN_EXCHANGE_API_VALIDATOR_URL: '{{.TOKEN_EXCHANGE_API_VALIDATOR_URL | default (env "TOKEN_EXCHANGE_API_VALIDATOR_URL") | default ""}}'
      TOKEN_EXCHANGE_ELICITATION_SECRET: '{{.TOKEN_EXCHANGE_ELICITATION_SECRET | default (env "TOKEN_EXCHANGE_ELICITATION_SECRET") | default ""}}'
      # Cluster-specific: defaults to the cluster's Solo UI host so it tracks CLUSTER (like
      # OAUTH_ISSUER_HOST). Override in .env only for a non-default gateway/host. Inert unless
      # TOKEN_EXCHANGE=true. Blank .env value → this derived default applies.
      TOKEN_EXCHANGE_CALLBACK_URL: '{{.TOKEN_EXCHANGE_CALLBACK_URL | default (env "TOKEN_EXCHANGE_CALLBACK_URL") | default (printf "https://ui.agw.%s.test/age/elicitations" (.CLUSTER | default .CLUSTERS | default "" | splitList " " | first))}}'
      OAUTH_ISSUER: '{{.OAUTH_ISSUER | default "false"}}'
      OAUTH_ISSUER_HOST: '{{.OAUTH_ISSUER_HOST | default (printf "agw.%s.test" .CLUSTER)}}'
      GATEWAY_NS: '{{.GATEWAY_NS | default ""}}'  # empty → script default agentgateway-system

  # ─── Gateway exposure (Gateway + TLS + DNS) ───────────────────────────────
  # Creates the Gateway and makes it reachable locally. Product-agnostic; defaults
  # target agentgateway (enterprise or community GatewayClass auto-resolved).

  expose:
    desc: "Create a Gateway (TLS + hostname)"
    summary: |
      Create a Gateway and make it reachable locally: mkcert TLS cert (HOST + *.HOST),
      the Gateway resource (HTTP + HTTPS listeners), and an /etc/hosts entry (needs sudo).
      CLASS is edition-aware: prefers the GatewayClass actually on the cluster
      (enterprise-agentgateway|agentgateway, enterprise-kgateway|kgateway).

      With CONTEXT set (external, e.g. EKS) it switches to the cloud path: a public
      LoadBalancer with a self-signed cert minted for the LB's resolved hostname, and
      NO /etc/hosts edit (the LB hostname is public DNS). The phase-4c agent trusts the
      mkcert CA, which is why self-signed is fine.

      Variables:
        CLUSTER      cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        CONTEXT      external kube context (EKS); set → cloud path      default "" (vind)
        PRODUCT      agentgateway | kgateway                           auto-detected from GatewayClasses
        NAME         Gateway name                                      default per PRODUCT (agw / kgw)
        NAMESPACE    namespace                                         default per PRODUCT (agentgateway-system / kgateway-system)
        CLASS        gatewayClassName                                  default: detected (enterprise-* or community)
        HOST         TLS + DNS hostname                                default <NAME>.<CLUSTER>.test (vind) / resolved LB hostname (external)
        SECRET       TLS secret name                                   default <NAME>-tls
        HTTP_PORT    HTTP listener port                                default 8080
        HTTPS_PORT   HTTPS listener port                               default 443

      Examples:
        solomog expose CLUSTER=aaa
        solomog expose PRODUCT=kgateway CLUSTER=aaa
        solomog expose HTTP_PORT=9080 HTTPS_PORT=8443 CLUSTER=aaa
        solomog expose CONTEXT=arn:aws:eks:us-east-1:...:cluster/dmorgan-agw   # external EKS
        solomog expose CLUSTER=s1 DNS=real    # vsphere: real DNS + Certwarden LE cert (see .env.example)
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/run.sh "Expose gateway → {{.CLUSTER}}" bash scripts/expose.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      CONTEXT: '{{.CONTEXT | default ""}}'   # set → external (EKS): public LB + self-signed TLS, no /etc/hosts
      PRODUCT: '{{.PRODUCT | default ""}}'
      NAME: '{{.NAME | default ""}}'
      NAMESPACE: '{{.NAMESPACE | default ""}}'
      CLASS: '{{.CLASS | default ""}}'
      HOST: '{{.HOST | default ""}}'
      SECRET: '{{.SECRET | default ""}}'
      HTTP_PORT: '{{.HTTP_PORT | default ""}}'    # empty → expose.sh default 8080
      HTTPS_PORT: '{{.HTTPS_PORT | default ""}}'  # empty → expose.sh default 443
      DNS: '{{.DNS | default ""}}'                # empty → local (mkcert + /etc/hosts); real → SOLOMOG_DOMAIN + Certwarden LE cert (vsphere only)

  # ─── Monitoring (cross-cutting add-on) ────────────────────────────────────
  # Prometheus + Grafana for any product. Auto-detects product dashboards (like
  # `expose` auto-detects the gateway). Route Grafana via expose ROUTE=true.

  monitoring:
    desc: "Prometheus + Grafana on CLUSTER"
    summary: |
      Install Prometheus + Grafana (kube-prometheus-stack, OSS, edition-agnostic) on a
      cluster. Auto-detects products from GatewayClasses and layers on their dashboards.
      With ROUTE=true, routes Grafana at grafana.<gw>.<cluster>.test.

      Variables:
        CLUSTER      cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        DASHBOARDS   auto | agentgateway | none                         default auto (detect)
        ROUTE        true | false — route Grafana on a sub-host         default false
        GATEWAY      gateway to route Grafana through                   default agw
        GATEWAY_NS   gateway namespace                                  default agentgateway-system

      Examples:
        solomog monitoring CLUSTER=aaa
        solomog monitoring expose ROUTE=true CLUSTER=aaa
        solomog monitoring DASHBOARDS=none CLUSTER=aaa
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/run.sh "Install monitoring → {{.CLUSTER}}" bash scripts/install-monitoring.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      CONTEXT: '{{.CONTEXT | default ""}}'
      EDITION: '{{.EDITION}}'
      DASHBOARDS: '{{.DASHBOARDS | default "auto"}}'
      ROUTE: '{{.ROUTE | default "false"}}'
      GATEWAY: '{{.GATEWAY | default "agw"}}'
      GATEWAY_NS: '{{.GATEWAY_NS | default ""}}'  # empty → script default agentgateway-system

  # ─── Custom config bundles ────────────────────────────────────────────────
  # Apply a directory of bespoke manifests (customer repros) to a cluster, in
  # order. The escape hatch for config not worth generalizing into a product/app.

  apply:
    desc: "Apply bundle(s) to CLUSTER (BUNDLE= or BUNDLES=)"
    summary: |
      Apply a custom-config bundle (a directory of manifests under bundles/<name>/) to a
      cluster, in sorted order. .sh hooks run in place; .yaml.tmpl files render %%TOKEN%%
      placeholders. Idempotent (kubectl apply); never prunes.

      Variables:
        BUNDLE       bundle name(s) under bundles/ or bundles/private/ (REQUIRED)   see: solomog bundles:list
        BUNDLES      alias for BUNDLE; either may list several (space-separated), applied left-to-right
        CLUSTER      cluster name (vind, or registered external)               REQUIRED — set CLUSTER (or CONTEXT)
        DRY_RUN      true | false — server-side dry-run, writes nothing             default false
        GATEWAY      gateway name for %%GATEWAY%% / %%HOST%%                         auto-detected agw/kgw
        HOST         host for %%HOST%%                                              default <GATEWAY>.<CLUSTER>.test
        BEDROCK_GUARDRAIL_ID       AWS Bedrock guardrail id for %%BEDROCK_GUARDRAIL_ID%%        from .env
        BEDROCK_GUARDRAIL_VERSION  its version / DRAFT for %%BEDROCK_GUARDRAIL_VERSION%%       from .env

      Examples:
        solomog apply BUNDLE=llmroute CLUSTER=aaa
        solomog apply BUNDLE=llmroute-bedrock-guardrails CLUSTER=g1 BEDROCK_GUARDRAIL_VERSION=DRAFT
        solomog apply BUNDLES="llmroute-vertex llmroute-bedrock" CLUSTER=aaa
        solomog apply BUNDLE=agw-dr CLUSTER=aaa DRY_RUN=true
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      # BUNDLE and BUNDLES are interchangeable (like CLUSTER/CLUSTERS); either may name
      # several bundles, applied left-to-right. apply-bundle.sh loops over the list.
      BUNDLES: '{{.BUNDLES | default .BUNDLE}}'
    cmds:
      - bash scripts/run.sh "Apply bundle(s) {{.BUNDLES}} → {{.CLUSTER}}" bash scripts/apply-bundle.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      # CONTEXT is an explicit override; unset → CLUSTER resolves via the registry (external,
      # e.g. EKS) or the vind default. See scripts/lib/target.sh.
      CONTEXT: '{{.CONTEXT | default ""}}'
      BUNDLE: '{{.BUNDLES}}'
      DRY_RUN: '{{.DRY_RUN | default "false"}}'
      GATEWAY: '{{.GATEWAY | default ""}}'   # empty → apply-bundle.sh auto-detects agw/kgw
      HOST: '{{.HOST | default ""}}'
      # Wired so a CLI arg can override .env for a one-off (e.g. test a published guardrail
      # version without editing .env). Safe to also live in .env: unlike TOKEN_EXCHANGE these
      # are inert for every bundle that does not reference the tokens.
      BEDROCK_GUARDRAIL_ID: '{{.BEDROCK_GUARDRAIL_ID | default ""}}'
      BEDROCK_GUARDRAIL_VERSION: '{{.BEDROCK_GUARDRAIL_VERSION | default ""}}'

  graph:
    desc: "Open an agentgateway config graph in the browser"
    summary: |
      Snapshot a cluster's agentgateway configuration and render it as an interactive,
      self-contained HTML graph in your browser: a top-down hierarchy rooted at the Gateway
      (data plane) → HTTPRoutes → Backends → Policies, with the control plane shown via the
      GatewayClass chain (Gateway → gatewayClassName → GatewayClass → controllerName →
      enterprise-agentgateway → manages → Gateway) and its proxy pod. Nodes are colour-coded by
      kind, and by plane (data / control / class) per the legend. Unused routes, backends, and
      policies are hidden by default and available from the unused-components toggle; a second
      toggle shows/hides auxiliary control-plane services. Click any node for its details and a
      copy-paste kubectl command. Repeated references are aggregated into a counted, thicker edge
      and listed in the backend detail panel. Same relationship model as `solomog routes`.

      By default also port-forwards each gateway pod's admin port (:15000) on an ephemeral local
      port and fetches /config_dump — surfaces the live proxy version in the subtitle, marks
      which routes/backends/policies the proxy actually loaded, and embeds the dump (Dump button
      → summary + download). Soft-fails if the admin port is unreachable (falls back to the
      dataplane image tag for version). DUMP=false skips the fetch.

      The HTML is self-contained (graph lib + data inlined) — it works offline and can be
      handed off. By DEFAULT it just opens the file (the task then exits cleanly, nothing to
      stop). SERVE=true serves it on a local port instead (nicer clipboard support); stop
      that with Enter for a clean exit.

      Variables:
        CLUSTER       cluster to graph (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        OPEN          true | false — open the file in a browser              default true
        SERVE         true — serve on a local port (Enter to stop) instead of opening the file
        OUT           output HTML path                default .solomog/graph/<cluster>-<ts>.html
        PORT          serve port (SERVE=true only)     default an ephemeral free port
        DUMP          true | false — fetch proxy /config_dump               default true
        DUMP_TIMEOUT  seconds to wait for port-forward/curl                 default 15

      Examples:
        solomog graph CLUSTER=a10
        solomog graph CLUSTER=a10 OPEN=false
        solomog graph CLUSTER=a10 SERVE=true
        solomog graph CLUSTER=a10 DUMP=false
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/run.sh "Graph agentgateway config → {{.CLUSTER}}" bash scripts/graph.sh {{.CLUSTER}}
    env:
      # CONTEXT override: graph an existing external context (EKS) instead of vind.
      # Empty → vind default vcluster-docker_<cluster>. See scripts/lib/target.sh.
      CONTEXT: '{{.CONTEXT | default ""}}'
      OPEN: '{{.OPEN | default "true"}}'
      SERVE: '{{.SERVE | default "false"}}'
      OUT: '{{.OUT | default ""}}'
      PORT: '{{.PORT | default ""}}'
      DUMP: '{{.DUMP | default "true"}}'
      DUMP_TIMEOUT: '{{.DUMP_TIMEOUT | default "15"}}'

  export:
    desc: "Export a bundle as a secret-safe hand-off package"
    summary: |
      Package a bundle's DECLARATIVE config (its .yaml / .yaml.tmpl) into a portable,
      secret-safe directory you can hand to someone NOT using solomog. Stateless — touches
      no cluster. Produces manifests/ (apply order preserved), env.example (vars the bundle
      needs, secrets flagged), PREREQUISITES.md (product/version/flags), install/values.yaml
      (resolved install values, best-effort), and README.md. A secret backstop scans the
      package for real .env values and redacts any that leak.

      Phase 1: .sh hooks are NOT executed — they're copied into manual-steps/ and listed in
      the README as explicit manual steps (so the package never looks complete when a hook's
      config isn't captured). Rendering + drift-verify against a live cluster come later.

      Variables:
        BUNDLE    bundle name to export (REQUIRED)                     see: solomog bundles:list
        OUT       output directory            default .solomog/exports/<bundle>-<timestamp>
        EDITION   enterprise | community       default enterprise      (for resolved install values)
        CLUSTER   value rendered for %%CLUSTER%% default "example"      (recipient substitutes)
        GATEWAY   value rendered for %%GATEWAY%% default agw
        HOST      value rendered for %%HOST%%    default <GATEWAY>.<CLUSTER>.test

      Examples:
        solomog export BUNDLE=agw-okta-mcp
        solomog export BUNDLE=llmroute OUT=~/handoff/llmroute
    cmds:
      - bash scripts/run.sh "Export bundle {{.BUNDLE}}" bash scripts/export-bundle.sh
    env:
      BUNDLE: '{{.BUNDLES | default .BUNDLE}}'
      OUT: '{{.OUT | default ""}}'
      EDITION: '{{.EDITION}}'
      CLUSTER: '{{.CLUSTER | default ""}}'
      GATEWAY: '{{.GATEWAY | default ""}}'
      HOST: '{{.HOST | default ""}}'

  bundles:list:
    desc: "List custom-config bundles (FILTER=<substr>)"
    summary: |
      List custom-config bundles under bundles/ and bundles/private/, with the first
      README line and a (private) tag. Cluster-free (discovery only — does not apply
      anything). FILTER=<substr> keeps only names that contain that substring
      (case-insensitive, literal — not a regex). Empty FILTER lists everything.

      FILTER not MATCH: go-task reserves MATCH for wildcard task captures, so a
      CLI MATCH=… never reaches the script.

      Variables:
        FILTER    substring to filter bundle names   default empty (all)

      Examples:
        solomog bundles:list
        solomog bundles:list FILTER=citizens
        solomog bundles:list FILTER=outsystems
    env:
      # CLI-only on purpose: a FILTER sitting in .env would silently shrink every list.
      # Named FILTER (not MATCH) because go-task's MATCH var is the wildcard capture array.
      FILTER: '{{.FILTER | default ""}}'
    cmds:
      - bash scripts/bundles.sh list

  bundles:show:
    desc: "Show a bundle's manifests in apply order"
    summary: |
      Show a bundle's manifests in apply order, with [tmpl]/[exec] markers. Cluster-free
      (discovery only — does not apply anything).

      Variables:
        BUNDLE    bundle name to inspect (REQUIRED)   see: solomog bundles:list
        BUNDLES   alias for BUNDLE (same as apply/test/export)
    vars:
      BUNDLES: '{{.BUNDLES | default .BUNDLE}}'
    cmds:
      - bash scripts/bundles.sh show {{.BUNDLES}}

  test:
    desc: "Run bundle tests against CLUSTER"
    summary: |
      Run a bundle's tests (bundles/<name>/tests/*.sh) against a cluster, in sorted order.
      Each test inherits CONTEXT/CLUSTER/GATEWAY/HOST + .env; pass/fail is the exit code.
      Output is captured to .solomog/test-runs/<bundle>-<ts>/ (gitignored).

      Variables:
        BUNDLE       bundle name(s) whose tests/ to run (REQUIRED)         see: solomog bundles:list
        BUNDLES      alias for BUNDLE; either may list several, run in order
        TESTS        run only tests whose name starts with these prefixes  default all; e.g. "54" or "54 56"
        CLUSTER      cluster name (vind, or registered external)       REQUIRED — set CLUSTER (or CONTEXT)
        GATEWAY      gateway name for the $HOST default                    auto-detected agw/kgw
        HOST         base host for curls in tests                          default <GATEWAY>.<CLUSTER>.test

      Examples:
        solomog test BUNDLE=llmroute-bedrock CLUSTER=aaa
        solomog test BUNDLES="llmroute-vertex llmroute-bbr" CLUSTER=aaa
        solomog test BUNDLE=citizens-agentcore-user TESTS="54" CLUSTER=aaa
        solomog test BUNDLE=citizens-agentcore-user TESTS="54 56" CLUSTER=aaa
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      # BUNDLE/BUNDLES interchangeable; either may name several bundles, tested in order.
      BUNDLES: '{{.BUNDLES | default .BUNDLE}}'
    cmds:
      - bash scripts/run.sh "Test bundle(s) {{.BUNDLES}} → {{.CLUSTER}}" bash scripts/test-bundle.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      # CONTEXT is an explicit override; unset → CLUSTER resolves via the registry (external)
      # or the vind default. See scripts/lib/target.sh.
      CONTEXT: '{{.CONTEXT | default ""}}'
      BUNDLE: '{{.BUNDLES}}'
      # Optional prefix filter — only run tests whose file name starts with one of these
      # (space-separated). Empty = all. CLI-only knob; not sourced from .env.
      TESTS: '{{.TESTS | default ""}}'
      GATEWAY: '{{.GATEWAY | default ""}}'   # empty → test-bundle.sh auto-detects agw/kgw
      HOST: '{{.HOST | default ""}}'

  # ─── Standalone (no cluster) ───────────────────────────────────────────────
  # A different shape from every other task here: standalone agentgateway is one
  # self-contained binary with no control plane and no CRDs, so it runs as a plain Docker
  # container against a local config file. No vind, no Gateway, no /etc/hosts, no mkcert.
  # The UI is the gateway's OWN built-in UI — NOT the Solo Enterprise UI management chart
  # that `agentgateway:ui` installs onto a cluster. Version pin is
  # AGENTGATEWAY_STANDALONE_VERSION (separate from AGENTGATEWAY_VERSION on purpose).

  standalone:
    desc: "0 clusters · run agentgateway standalone in Docker"
    summary: |
      Start standalone agentgateway in a Docker container, serving standalone/<NAME>/config.yaml.
      No Kubernetes involved. Prints the gateway and UI URLs when it is ready.

      Host ports are probed and incremented until one is free (PORT_TRIES attempts), and a
      run that loses the race to Docker's own allocation check is retried one port higher —
      so two instances, or a busy 4000, never wedge the task.

      Variables:
        NAME         config dir under standalone/                  REQUIRED — see standalone:list
        BIND         host address to publish on                    default 127.0.0.1
        UI_PORT      first host port tried for the UI              default 15000
        GW_PORT      first host port tried for gateway ports       default the config's own port
        PORT_TRIES   ports to probe before giving up               default 25
        IMAGE        full image ref override                       default from versions.env
        FOLLOW       true to tail logs after start                 default false

      BIND defaults to loopback deliberately: Docker's own default (0.0.0.0) would put the
      UI on your LAN. BIND=0.0.0.0 opts into that; the port probe then tests that address
      instead, since a listener on 0.0.0.0:4000 also blocks 127.0.0.1:4000.

      Licensing: needs AGENTGATEWAY_LICENSE_KEY in .env. Standalone refuses to start
      unlicensed (no grace period on a fresh install), and does NOT fall back to
      SOLO_LICENSE_KEY — the standalone verifier requires a 'product' claim the generic
      key does not carry.

      Secrets: reference them as $VAR in the config; the gateway expands them from its
      environment at load time, and solomog detects the references and passes those
      variables into the container. A missing one is reported by name before start.

      Examples:
        solomog standalone NAME=minimal
        solomog standalone NAME=llm FOLLOW=true
        solomog standalone NAME=minimal UI_PORT=16000 BIND=0.0.0.0
    cmds:
      - bash scripts/run.sh "Start standalone agentgateway → {{.NAME}}" bash scripts/standalone.sh run
    env:
      NAME: '{{.NAME | default ""}}'
      BIND: '{{.BIND | default "127.0.0.1"}}'
      UI_PORT: '{{.UI_PORT | default "15000"}}'
      GW_PORT: '{{.GW_PORT | default ""}}'
      PORT_TRIES: '{{.PORT_TRIES | default "25"}}'
      IMAGE: '{{.IMAGE | default ""}}'
      FOLLOW: '{{.FOLLOW | default "false"}}'

  standalone:stop:
    desc: "Stop a standalone instance"
    summary: |
      Stop and remove the container for standalone/<NAME>. Leaves the config and its
      SQLite state on disk, so a later `solomog standalone NAME=<same>` picks up where you
      left off.

      Variables:
        NAME    config dir under standalone/   REQUIRED

      Examples:
        solomog standalone:stop NAME=minimal
    cmds:
      - bash scripts/run.sh "Stop standalone agentgateway → {{.NAME}}" bash scripts/standalone.sh stop
    env:
      NAME: '{{.NAME | default ""}}'

  standalone:list:
    desc: "List standalone configs and running instances"
    summary: |
      List the configs under standalone/ and every running solomog standalone container
      with its published ports. Cluster-free; needs only Docker.

      No variables.

      Examples:
        solomog standalone:list
    cmds:
      - bash scripts/standalone.sh list
    silent: true

  standalone:logs:
    desc: "Tail a standalone instance's logs"
    summary: |
      Show the tail of the container log for standalone/<NAME>.

      Variables:
        NAME         config dir under standalone/   REQUIRED
        TAIL_LINES   how many lines to show         default 60

      Named TAIL_LINES, not LINES: bash owns LINES (terminal height), so an inherited
      value would quietly win over yours.

      Examples:
        solomog standalone:logs NAME=minimal
        solomog standalone:logs NAME=llm TAIL_LINES=200
    cmds:
      - bash scripts/standalone.sh logs
    silent: true
    env:
      NAME: '{{.NAME | default ""}}'
      TAIL_LINES: '{{.TAIL_LINES | default "60"}}'

  standalone:validate:
    desc: "Validate a standalone config (no cluster, no license)"
    summary: |
      Check standalone/<NAME>/config.yaml with the gateway's own `--validate-only`, which
      needs neither a cluster nor a license. Catches type errors, unknown fields, and
      environment variables the config references but that are not set.

      Worth knowing about that last one: the gateway expands $VAR over the WHOLE config
      file before parsing, comments included, and an unset variable aborts the entire load
      with an error that does not say which variable. This task names it. The single
      exception the gateway itself carves out is the `# yaml-language-server: $schema` hint
      line, which it strips before expanding.

      Variables:
        NAME    config dir under standalone/   REQUIRED

      Examples:
        solomog standalone:validate NAME=llm
    cmds:
      - bash scripts/run.sh "Validate standalone config → {{.NAME}}" bash scripts/standalone.sh validate
    env:
      NAME: '{{.NAME | default ""}}'

  standalone:import:
    desc: "Convert a LiteLLM config into a standalone config"
    summary: |
      Run the gateway's own importer over a foreign gateway config and write the result to
      standalone/<NAME>/config.yaml. Prints a per-field findings report: 'exact' translated
      cleanly, 'approximate' needs review, 'unsupported' was dropped.

      litellm is the only source the importer supports.

      Variables:
        NAME    destination dir under standalone/ (must not exist)   REQUIRED
        FILE    the source config to read                            REQUIRED
        FROM    source format                                        default litellm

      Examples:
        solomog standalone:import NAME=from-litellm FILE=~/litellm/config.yaml
    vars:
      # A task var, not an inline template in the cmds string: escaping nested quotes in a
      # YAML plain scalar produces a backslash that go-task's template parser rejects.
      FROM_LABEL: '{{.FROM | default "litellm"}}'
    cmds:
      - bash scripts/run.sh "Import {{.FROM_LABEL}} config → standalone/{{.NAME}}" bash scripts/standalone.sh import
    env:
      NAME: '{{.NAME | default ""}}'
      FILE: '{{.FILE | default ""}}'
      FROM: '{{.FROM | default "litellm"}}'

  # ─── Credentials ──────────────────────────────────────────────────────────

  gcp:refresh:
    desc: "Refresh GCP_ACCESS_TOKEN in .env (~1h)"
    summary: |
      Re-fetch a GCP access token (gcloud auth print-access-token) into .env as
      GCP_ACCESS_TOKEN (in-place — stays in its .env.example section; backs up first).
      ONLY updates .env — re-run your bundle to push it into the cluster secret. The token
      is short-lived (~1h); re-run this when a GCP-backed backend 401s.

      No variables. Uses the active gcloud account. Chain with apply to push it:
        solomog gcp:refresh apply BUNDLE=llmroute-vertex CLUSTER=aaa
    cmds:
      - bash scripts/run.sh "Refresh GCP access token" bash scripts/gcp-refresh.sh

  aws:refresh:
    desc: "Refresh AWS SSO creds in .env"
    summary: |
      Export AWS SSO credentials (access key + secret + session token) into .env (in-place —
      stays in the Upstream credentials section; backs up first), running `aws sso login`
      first if the session is stale. ONLY updates .env — re-run your bundle to push them into
      the cluster secret. SSO creds are short-lived (<=12h); re-run when a Bedrock route
      401/403s. One-time setup: `aws configure sso` (session SOlo).

      Variables (set in .env, not on the command line):
        AWS_PROFILE       SSO profile to export                       the one `aws configure sso` created
        AWS_SSO_SESSION   SSO session name for the login fallback     default SOlo

      Chain with apply to push them:
        solomog aws:refresh apply BUNDLE=llmroute-bedrock CLUSTER=aaa
    cmds:
      - bash scripts/run.sh "Refresh AWS credentials" bash scripts/aws-refresh.sh

  # AgentCore CLI credentials. Deliberately NOT aws:refresh's model: `agentcore` runs in YOUR
  # shell (never reads .env) so it wants the auto-refreshing SSO PROFILE, not the short-lived
  # static keys aws:refresh stashes for bundles. Un-framed (no run.sh) like bundles:list —
  # agentcore:env's stdout must stay pure shell for `eval`, and shell mode is interactive.
  agentcore:list:
    desc: "List AgentCore projects (verified against AWS)"
    summary: |
      List every AgentCore project (any dir holding agentcore/agentcore.json) with its region,
      whether the runtime exists, and its path. Projects are discovered from disk — no project
      or bundle names are hardcoded.

      Verified against AWS by default. A project's local deployed-state.json is written by
      `agentcore deploy` and updated by nothing else, so on its own it reports runtimes deleted
      out of band (delete-stack, console) as still live. The IN_AWS column asks AWS instead:
        yes    the runtime exists
        GONE   local state claims it, AWS disagrees -> solomog agentcore:prune
        -      no local deploy record (never deployed from here, or already pruned)
      When credentials are not available it falls back to local state, relabels the column
      LOCAL?, and says plainly that it is unverified rather than implying otherwise.

      Variables:
        LIVE   auto | true | false                                              default auto
               auto   verify if credentials already work; never triggers a login
               true   verify, running `aws sso login` (browser) if the session is stale
               false  local state only, no AWS calls

      Examples:
        solomog agentcore:list
        solomog agentcore:list LIVE=true
    env:
      LIVE: '{{.LIVE | default "auto"}}'
    cmds:
      - bash scripts/agentcore-env.sh list

  agentcore:prune:
    desc: "Drop local AgentCore state AWS no longer has"
    summary: |
      Reconcile local state after a runtime was deleted outside the CLI (delete-stack / console),
      which leaves deployed-state.json claiming a runtime that no longer exists.

      Queries AWS, and for every project whose recorded runtime is gone, removes that entry —
      deleting the file outright when it held the only runtime, since that is exactly the shape
      of a never-deployed project. Backs each file up to .solomog/agentcore-state-backups/ first.
      Only ever removes state that is ALREADY false: it never calls AWS destructively and never
      touches agentcore.json (the project config) or your .env.

      Variables:
        DRY_RUN   true → report what would be pruned, change nothing   default false

      Examples:
        solomog agentcore:prune DRY_RUN=true
        solomog agentcore:prune
    env:
      DRY_RUN: '{{.DRY_RUN | default "false"}}'
    cmds:
      - bash scripts/agentcore-env.sh prune

  agentcore:env:
    desc: "Print AWS SSO exports for the agentcore CLI"
    summary: |
      Put a working AWS identity for the `agentcore` CLI into your CURRENT shell. Resolves
      credentials through the SSO PROFILE (auto-refreshing — nothing to re-stash, unlike
      aws:refresh's <=12h static keys) and drops the four static AWS_* vars, whose stale values
      would otherwise SHADOW the profile and 403 every call. With NAME it also pins that
      project's own region (projects in one repo routinely target different regions) and exports
      AGENTCORE_PROJECT / AGENTCORE_RUNTIME_ARN.

      Only shell-eval-able lines go to stdout, so it is safe inside eval even when it has to
      run `aws sso login` (browser) first. MUST be eval'd — a child process cannot change your
      shell. Use agentcore:shell instead if you want the project dir too.

      Variables:
        NAME      project / runtime name                see: solomog agentcore:list
        REGION    override the project's region         default from its aws-targets.json
        PROFILE   override the SSO profile              default AWS_PROFILE from .env

      Examples:
        eval "$(solomog agentcore:env NAME=<project>)"    # names: solomog agentcore:list
        eval "$(solomog agentcore:env)"                  # creds only, no region/project pin
    env:
      NAME: '{{.NAME | default ""}}'
      REGION: '{{.REGION | default ""}}'
      PROFILE: '{{.PROFILE | default ""}}'
    cmds:
      - bash scripts/agentcore-env.sh env

  agentcore:shell:
    desc: "Subshell in an AgentCore project with SSO creds"
    summary: |
      Same credentials as agentcore:env, but drops you in an interactive subshell already cd'd
      into the project directory (the one holding agentcore/agentcore.json), with AWS_REGION
      pinned to that runtime's own region and AGENTCORE_PROJECT / AGENTCORE_RUNTIME_ARN set —
      so the runbooks' `agentcore status --runtime "$AGENTCORE_PROJECT"` and
      `verify_sigv4.py` work as written. Prints the teardown one-liner, and warns when the
      project is a JWT-inbound runtime (those must go through redeploy.sh, never a bare
      `agentcore deploy`). `exit` returns to your normal shell.

      Variables:
        NAME      project / runtime name (REQUIRED)     see: solomog agentcore:list
        REGION    override the project's region         default from its aws-targets.json
        PROFILE   override the SSO profile              default AWS_PROFILE from .env

      Examples:
        solomog agentcore:shell NAME=<project>           # names: solomog agentcore:list
    env:
      NAME: '{{.NAME | default ""}}'
      REGION: '{{.REGION | default ""}}'
      PROFILE: '{{.PROFILE | default ""}}'
    cmds:
      - bash scripts/agentcore-env.sh shell

  env:backup:
    desc: "Snapshot .env to .solomog/env-backups/"
    summary: |
      Snapshot the repo-root .env into .solomog/env-backups/<YYYYMMDD-HHMMSS>.env (mode 600).
      Keeps the newest 20 backups. aws:refresh / gcp:refresh / env:sync also backup automatically
      before mutating .env.

      Variables:
        (none)

      Examples:
        solomog env:backup
    cmds:
      - bash scripts/run.sh "Backup .env" bash scripts/env-backup.sh

  env:sync:
    desc: "Rebuild .env from .env.example (keeps your values)"
    summary: |
      Rebuild .env from .env.example so section order and explanatory comments stay aligned with
      the template, while keeping your existing values. Keys only in your .env land under a
      Local-only section (non-destructive). CLI-only flags (TOKEN_EXCHANGE, OAUTH_ISSUER) are
      dropped with a note. Backs up to .solomog/env-backups/ first.

      Run after pulling .env.example changes, or when the file feels scrambled.

      Variables:
        (none)

      Examples:
        solomog env:sync
        solomog env:diff    # see drift first
    cmds:
      - bash scripts/run.sh "Sync .env from .env.example" bash scripts/env-sync.sh

  env:diff:
    desc: "Show key drift vs .env.example (names only)"
    summary: |
      Compare keys in .env vs .env.example. Reports missing keys (run env:sync), local-only /
      stale keys, and CLI-only keys that should not persist. Never prints secret values.

      Variables:
        (none)

      Examples:
        solomog env:diff
    cmds:
      - bash scripts/run.sh "Diff .env vs .env.example" bash scripts/env-diff.sh

  eks:create:
    desc: "Create an EKS cluster and register its kube context"
    summary: |
      Provision the EKS cluster for the agentgateway EKS tier: `eksctl create cluster --with-oidc`
      then `aws eks update-kubeconfig`, printing the kube CONTEXT to thread through the rest of the
      flow (agentgateway → expose → apply → eks:irsa). Idempotent (skips create if the cluster
      exists). Provisions REAL infra (~15-20 min, costs $). `--with-oidc` sets up the IAM OIDC
      provider that eks:irsa needs.

      Needs AWS creds: `solomog aws:refresh` (writes .env; the task reloads it, robust to stale shell creds) or export them in the shell. Plus eksctl.

      Variables:
        CLUSTER        EKS cluster NAME (required — no default; this makes a real cluster)
        EKS_REGION     cluster region (preferred)      explicit knob; e.g. EKS_REGION=us-east-2
        AWS_REGION     cluster region (fallback)       default us-east-1 if neither set
        EKS_VERSION    Kubernetes version              pinned in versions.env (1.34); override per-run
        EKS_NODES      managed node count              default 2
        EKS_NODE_TYPE  instance type                   default m5.large
        OWNER          owner=<val> tag (from .env)     default "solomog" — set to your email

      Example:
        export AWS_PROFILE=AdministratorAccess-170015905430
        eval "$(aws configure export-credentials --format env)"
        solomog eks:create CLUSTER=dmorgan-agw
    cmds:
      - bash scripts/run.sh "Create EKS cluster {{.CLUSTER}}" bash scripts/eks-create.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default ""}}'
      EKS_REGION: '{{.EKS_REGION | default ""}}'
      AWS_REGION: '{{.AWS_REGION | default ""}}'
      EKS_VERSION: '{{.EKS_VERSION | default ""}}'
      EKS_NODES: '{{.EKS_NODES | default ""}}'
      EKS_NODE_TYPE: '{{.EKS_NODE_TYPE | default ""}}'
      OWNER: '{{.OWNER | default ""}}'

  eks:delete:
    desc: "Tear down named EKS cluster(s)"
    summary: |
      Safely delete EKS cluster(s) solomog installed onto — the complement to eks:create. Deletes
      the Gateways + LoadBalancer Services FIRST so AWS drops the ELBs (whose ENIs would otherwise
      pin the subnets and fail the VPC delete → orphaned VPC → burned VPC-quota slot), waits for
      them to drain, then `eksctl delete cluster`, then deregisters from .solomog/contexts and
      removes the ARN-named kubeconfig entries (eksctl skips those, so dead contexts used to linger
      in kubectx). Also self-heals orphans: deletes any LB left in the VPC (and the k8s-elb-* SGs the
      ELB leaves behind), and if the control plane is already gone deletes the eksctl-<name>-*
      CloudFormation stacks directly (disabling termination protection). MUTATES AWS. EKS only.
      Non-eks names are refused (use that type's delete, or `solomog teardown`).

      Needs AWS creds: `solomog aws:refresh` (writes .env; the task reloads it, robust to stale shell creds) or export them in the shell. Plus eksctl.

      Variables:
        CLUSTER / CLUSTERS  registered EKS cluster name(s), space-separated (required —
                            no default; destructive; one prompt for the whole batch)
        FORCE       true → skip the confirmation prompt (scripted teardown)   default false
        EKS_REGION  cluster region (preferred)      explicit override
        AWS_REGION  region (fallback)               default: derived from the context ARN
        GATEWAY     gateway name (default agw)       informational; all Gateways + LB svcs are removed

      Example:
        export AWS_PROFILE=AdministratorAccess-170015905430
        eval "$(aws configure export-credentials --format env)"
        solomog eks:delete CLUSTER=dmorgan-agw
        solomog eks:delete CLUSTERS="e1 e2"
    cmds:
      - bash scripts/run.sh "Delete EKS cluster {{.CLUSTER}}" bash scripts/eks-delete.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default ""}}'
      CONTEXT: '{{.CONTEXT | default ""}}'
      FORCE: '{{.FORCE | default ""}}'
      EKS_REGION: '{{.EKS_REGION | default ""}}'
      AWS_REGION: '{{.AWS_REGION | default ""}}'
      GATEWAY: '{{.GATEWAY | default ""}}'

  eks:irsa:
    desc: "IRSA for the agentgateway proxy on EKS"
    summary: |
      Wire the agentgateway proxy ServiceAccount to an IAM role via IRSA (uc05 Trust path A), so
      it signs SigV4 to AgentCore keyless — no more <=12h SSO-cred expiry + rollout dance. Creates
      an IAM invoke policy + web-identity role, annotates the SA, strips the static env creds, and
      restarts the proxy. Idempotent. EKS only (CLUSTER registered by eks:create, or CONTEXT set).
      Mutates AWS IAM + the proxy.

      Needs AWS creds: `solomog aws:refresh` (writes .env; the task reloads it, robust to stale shell creds) or export them in the shell. Plus eksctl.

      Variables:
        CLUSTER     registered EKS cluster name (required)             e.g. dmorgan-agw
        CONTEXT     override: target an unregistered kube context      e.g. arn:aws:eks:...:cluster/dmorgan-agw
        GATEWAY     proxy Deployment name (SA auto-detected)           default agw
        EKS_REGION  cluster region (preferred)                         explicit override
        AWS_REGION  region (fallback)                                  default: derived from the context ARN
        AGENTCORE_RUNTIME_ARN[_2]  runtimes to scope the policy to (from .env; else runtime/* wildcard)

      Example:
        export AWS_PROFILE=AdministratorAccess-170015905430
        eval "$(aws configure export-credentials --format env)"
        solomog eks:irsa CLUSTER=dmorgan-agw
    cmds:
      - bash scripts/run.sh "IRSA for agentgateway proxy" bash scripts/eks-irsa.sh
    env:
      CONTEXT: '{{.CONTEXT | default ""}}'
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      GATEWAY: '{{.GATEWAY | default ""}}'    # empty → script default (agw)
      EKS_REGION: '{{.EKS_REGION | default ""}}'
      AWS_REGION: '{{.AWS_REGION | default ""}}'

  # ─── Sample apps ─────────────────────────────────────────────────────────
  # Deployed to CLUSTER (CLUSTER required); context resolves via lib/target.sh (vind, EKS, vsphere).

  apps:bookinfo:
    desc: "Deploy Bookinfo to CLUSTER"
    summary: |
      Deploy the Istio Bookinfo sample app to a cluster.

      Variables:
        CLUSTER   cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/run.sh "Deploy Bookinfo → {{.CLUSTER}}" bash scripts/apps/install-bookinfo.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      CONTEXT: '{{.CONTEXT | default ""}}'

  apps:online-boutique:
    desc: "Deploy Online Boutique to CLUSTER"
    summary: |
      Deploy the Online Boutique sample app to a cluster.

      Variables:
        CLUSTER   cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      # No install script for this app, so resolve the context inline via lib/target.sh
      # (registry-aware) instead of hardcoding the vind prefix.
      - bash scripts/run.sh "Deploy Online Boutique → {{.CLUSTER}}" bash -c 'source scripts/lib/target.sh; solomog_require_cluster "${CLUSTER:-}" "apps:online-boutique"; exec helmfile sync -f helmfiles/apps/online-boutique.yaml --kube-context "$(solomog_context "${CLUSTER:-}")"'
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      CONTEXT: '{{.CONTEXT | default ""}}'

  apps:utils:
    desc: "Deploy utils (httpbin, curl, netshoot)"
    summary: |
      Deploy utility workloads (httpbin, curl, netshoot). httpbin is a plain Service
      backend, so it works on ANY gateway (agw/kgw, auto-detected). With ROUTE=true, adds
      an HTTPRoute for httpbin at ROUTE_PATH (URLRewrite strips the prefix).

      Variables:
        CLUSTER      cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        ROUTE        true | false — route httpbin                       default false
        ROUTE_PATH   path to route httpbin on                           default /httpbin
        GATEWAY      gateway name                                       auto-detected agw/kgw
        GATEWAY_NS   gateway namespace                                  auto-detected

      Run `solomog expose` so routes program. See `solomog help expose`.
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/run.sh "Deploy utils (httpbin, curl, netshoot) → {{.CLUSTER}}" bash scripts/apps/install-utils.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      CONTEXT: '{{.CONTEXT | default ""}}'
      # TODO: ROUTE (like other dotenv-sourced vars) can stick from .env — if ROUTE=true
      # is ever set there, every apps:* run adds routes without CLI opt-in. TOKEN_EXCHANGE
      # was specially made CLI-only; ROUTE was not. Prefer not putting ROUTE in .env.
      ROUTE: '{{.ROUTE | default "false"}}'
      ROUTE_PATH: '{{.ROUTE_PATH | default "/httpbin"}}'
      GATEWAY: '{{.GATEWAY | default ""}}'
      GATEWAY_NS: '{{.GATEWAY_NS | default ""}}'

  apps:mock-openai:
    desc: "Deploy mock OpenAI (vLLM sim) to CLUSTER"
    summary: |
      Deploy a mock OpenAI server (vLLM simulator) in its own namespace, with an
      EnterpriseAgentgatewayBackend. agentgateway-only. With ROUTE=true, also adds an
      HTTPRoute at ROUTE_PATH on the gateway.

      Variables:
        CLUSTER      cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        ROUTE        true | false — add the HTTPRoute                   default false
        ROUTE_PATH   path to route on                                   default /openai
        GATEWAY      gateway to route through                          default agw
        APP_NS       workload namespace                                default mock-openai

      Run `solomog expose` so routes program. See `solomog help expose`.
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/run.sh "Deploy mock OpenAI (vLLM sim) → {{.CLUSTER}}" bash scripts/apps/install-mock-openai.sh
    env:
      ROUTE: '{{.ROUTE | default "false"}}'
      ROUTE_PATH: '{{.ROUTE_PATH | default "/openai"}}'
      GATEWAY: '{{.GATEWAY | default ""}}'   # empty → script default agw
      APP_NS: '{{.APP_NS | default ""}}'     # empty → script default mock-openai
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      CONTEXT: '{{.CONTEXT | default ""}}'

  apps:mcp-stripe:
    desc: "Deploy stripe-mock as MCP tools to CLUSTER"
    summary: |
      Deploy stripe-mock exposed as MCP tools (via OpenAPI) in the stripe-mock namespace,
      with an EnterpriseAgentgatewayBackend. agentgateway-only. With ROUTE=true, also adds
      an HTTPRoute at ROUTE_PATH on the gateway.

      Variables:
        CLUSTER      cluster name (vind, or registered external)   REQUIRED — set CLUSTER (or CONTEXT)
        ROUTE        true | false — add the HTTPRoute                   default false
        ROUTE_PATH   path to route on                                   default /mcp
        GATEWAY      gateway to route through                          default agw

      Run `solomog expose` so routes program. See `solomog help expose`.
    vars:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
    cmds:
      - bash scripts/run.sh "Deploy mock MCP (stripe-mock → OpenAPI) → {{.CLUSTER}}" bash scripts/apps/install-mcp-stripe.sh
    env:
      ROUTE: '{{.ROUTE | default "false"}}'
      ROUTE_PATH: '{{.ROUTE_PATH | default "/mcp"}}'
      GATEWAY: '{{.GATEWAY | default ""}}'   # empty → script default agw
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default "" | splitList " " | first}}'
      CONTEXT: '{{.CONTEXT | default ""}}'

  # ─── Teardown ─────────────────────────────────────────────────────────────

  teardown:
    aliases: ["delete"]
    desc: "Destroy named clusters (vind, vsphere, EKS)"
    summary: |
      Type-agnostic destroy. Requires CLUSTER=<name> or CLUSTERS="a b" — it does not
      default to all clusters. Detects each name (vind / vsphere / eks), prompts once
      with name+type, then dispatches to vind:delete / vsphere:delete / eks:delete.
      Mixed lists are fine. A registered generic external cluster is refused (solomog
      did not create it). FORCE=true skips the prompt (children run unattended).

      Type-specific: solomog vind:delete / vsphere:delete / eks:delete.

      Variables:
        CLUSTER / CLUSTERS   cluster name(s), space-separated (required — no default;
                             destructive; one prompt for the whole batch)
        FORCE      true → skip the confirmation prompt (scripted teardown)   default false

      Examples:
        solomog teardown CLUSTER=aaa
        solomog teardown CLUSTERS="aaa hl1 dmorgan-agw"
        solomog delete CLUSTER=aaa
    cmds:
      - bash scripts/run.sh "Tear down {{.CLUSTER}}" bash scripts/teardown.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default ""}}'
      FORCE: '{{.FORCE | default ""}}'

  vind:delete:
    desc: "Destroy named vcluster (vind) clusters"
    summary: |
      Destroy vcluster instances by name. Requires CLUSTER=<name> or CLUSTERS="a b" —
      it does not default to all clusters. Explicit names are not filtered against
      .solomog/clusters (you take responsibility for the name), but registered
      eks/vsphere/external names are refused (use that type's delete, or
      `solomog teardown`). Prunes stale .solomog/clusters entries when `vcluster list`
      is available. FORCE=true skips the prompt.

      Variables:
        CLUSTER / CLUSTERS   vind cluster name(s), space-separated (required — no default;
                             destructive; one prompt for the whole batch)
        FORCE      true → skip the confirmation prompt (scripted teardown)   default false

      Examples:
        solomog vind:delete CLUSTER=aaa
        solomog vind:delete CLUSTERS="aaa bbb"
    cmds:
      - bash scripts/run.sh "Delete vind cluster {{.CLUSTER}}" bash scripts/vind-teardown.sh
    env:
      CLUSTER: '{{.CLUSTER | default .CLUSTERS | default ""}}'
      FORCE: '{{.FORCE | default ""}}'
