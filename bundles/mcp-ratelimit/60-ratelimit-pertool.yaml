# ARM B — per-tool budgets.
#
# Limits MCP traffic per tool by reading the tool name out of the JSON-RPC body at the route,
# before the request reaches the MCP server. This policy builds the descriptor; the rate limit
# service in 50-rls-standalone.yaml matches it against a nested tree and counts it in Redis.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: mcp-pertool-ratelimit
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-pertool                 # the route fronting the MCP backend
  traffic:
    rateLimit:
      global:                           # global = Redis-backed; holds across gateway replicas
        domain: mcp-tools               # KEY: must match `domain` in the service config
        backendRef:
          name: mcp-ratelimit           # the rate limit service (gRPC, h2c)
          namespace: agentgateway-system
          port: 8081
        failureMode: FailOpen           # limiter unreachable -> traffic flows unlimited
        descriptors:
          - entries:                    # KEY: both entries = ONE chained descriptor
              - name: mcp_method        # tool calls vs everything else
                expression: |
                  json(request.body).with(body,
                    body.method == "tools/call" ? "tools/call" : "other"
                  )
              - name: tool_name         # KEY: reads the tool name out of the JSON-RPC body
                expression: |
                  json(request.body).with(body,
                    body.method == "tools/call" ? string(body.params.name) : "none"
                  )
