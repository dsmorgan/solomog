# ARM B infrastructure — a STANDALONE envoyproxy/ratelimit + Redis.
#
# Why not the rate-limiter the product already installs? Because reaching that one means going
# through a RateLimitConfig (arm C), and the enterprise translator PREPENDS a
# generic_key = "<namespace>.<name>" entry to every descriptor it builds. A hand-written MCP
# descriptor tree therefore never matches unless it is nested under that key. Supplying
# `domain` + `backendRef` + `descriptors` directly, as arm B does, is what keeps the descriptors
# exactly as written, and that needs a rate limit service whose config this bundle owns.
#
# Everything here lives in agentgateway-system, alongside the policy that references it, so no
# cross-namespace backendRef and no ReferenceGrant are involved.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-redis
  namespace: agentgateway-system
  labels: {app: mcp-redis, bundle: mcp-ratelimit}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-redis}
  template:
    metadata:
      labels: {app: mcp-redis, bundle: mcp-ratelimit}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-redis
  namespace: agentgateway-system
  labels: {bundle: mcp-ratelimit}
spec:
  selector: {app: mcp-redis}
  ports:
    - port: 6379
---
# The descriptor tree arm B resolves against. Counters are keyed on the descriptor VALUES, so
# the catch-all gives each tool its own bucket rather than one shared pool.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-ratelimit-config
  namespace: agentgateway-system
  labels: {bundle: mcp-ratelimit}
data:
  config.yaml: |
    domain: mcp-tools                   # KEY: matches the policy
    descriptors:
      - key: mcp_method
        value: tools/call               # KEY: only tool calls have a rule here.
        descriptors:                    #      initialize/tools-list map to "other", match
          - key: tool_name              #      nothing, and are therefore never counted.
            value: get-sum              # named tool: its own 3/min
            rate_limit:
              unit: minute
              requests_per_unit: 3
          - key: tool_name              # KEY: no `value` = catch-all. Each tool still gets
            rate_limit:                 #      its OWN 10/min bucket, not a shared pool.
              unit: minute
              requests_per_unit: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-ratelimit
  namespace: agentgateway-system
  labels: {app: mcp-ratelimit, bundle: mcp-ratelimit}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mcp-ratelimit}
  template:
    metadata:
      labels: {app: mcp-ratelimit, bundle: mcp-ratelimit}
      annotations:
        # Roll the pod when the descriptor tree changes; the service reads its config at start.
        checksum/config: "v1"
    spec:
      containers:
        - name: ratelimit
          image: envoyproxy/ratelimit:master
          ports:
            - containerPort: 8081
              name: grpc
          env:
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: mcp-redis:6379
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: RUNTIME_IGNOREDOTFILES
              value: "true"
            - name: LOG_LEVEL
              value: debug
            - name: USE_STATSD
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config
      volumes:
        - name: config
          configMap:
            name: mcp-ratelimit-config
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-ratelimit
  namespace: agentgateway-system
  labels: {bundle: mcp-ratelimit}
spec:
  selector: {app: mcp-ratelimit}
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
      # h2c: the rate limit API is gRPC, so the gateway must speak HTTP/2 cleartext to it.
      appProtocol: kubernetes.io/h2c
