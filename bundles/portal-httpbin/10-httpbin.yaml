# go-httpbin sample API — the ApiProduct backend for the portal catalog.
# Image is multi-arch (arm64 + amd64); listens on 8080.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: portal-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: portal-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: portal-system
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: httpbin
